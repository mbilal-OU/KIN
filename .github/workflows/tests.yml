name: KIN tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KIN_AI_PROVIDER: "off"
      GEMINI_API_KEY: "replace_with_your_own_key"
      KIN_HOSTED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q app.py kin_core.py kin_life.py kin_routines.py kin_models.py kin_ai.py kin_store.py
      - name: Run automated offline tests
        run: python -m pytest -q
      - name: Start the actual Streamlit server and check its health
        shell: bash
        env:
          KIN_HOSTED: "true"
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/kin-streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /tmp/kin-health; then
              echo "KIN Streamlit server is running"
              cat /tmp/kin-health
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Streamlit exited before it became healthy"
              cat /tmp/kin-streamlit.log
              exit 1
            fi
            sleep 1
          done
          echo "KIN Streamlit did not become healthy"
          cat /tmp/kin-streamlit.log
          exit 1
