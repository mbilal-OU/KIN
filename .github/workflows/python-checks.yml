name: KIN Python checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q app.py kin_ai.py kin_calendar.py kin_core.py kin_models.py kin_sources.py kin_store.py kin_theme.py
      - name: Run offline tests without API quota
        run: python -m pytest -q
